name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  control-plane:
    name: Control plane checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile published modules
        run: python -m compileall -q scripts living tests research

      # Lint: critical syntax/undefined-name class only (no full-tree style war)
      - name: Ruff critical checks
        run: |
          python -m pip install --quiet ruff
          ruff check scripts living research --select E9,F63,F7,F82 --output-format=github

      - name: Required surface present
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              "README.md",
              "LICENSE",
              "SETUP.md",
              "CONTRIBUTING.md",
              "CHANGELOG.md",
              "docs/ARCHITECTURE.md",
              "docs/OPERATIONS.md",
              "docs/WHY.md",
              "docs/CYCLE_RUNNER.md",
              "scripts/long_horizon_supervisor.py",
              "scripts/lh_watchdog.py",
              "scripts/aetheria_hope_path.py",
              "scripts/eval_residual_gate_v2.py",
              "scripts/verify_continuity_readonly.py",
              "scripts/status_report.py",
              "scripts/lh_process_identity.py",
              "scripts/plant_control.py",
              "tests/test_lh_process_identity.py",
              "docs/RELEASE_GATE.md",
              "docs/FRONTIER_EVOLUTION_WORKING_INSTRUCTIONS.md",
              "docs/INSTALL.md",
              "docs/SUPPORT.md",
              "scripts/aetheria.py",
              "research/README.md",
              "research/population.py",
              "requirements-dev.lock",
              "scripts/run_probe_bounded.py",
              "scripts/resource_check.py",
              "measurements/lh_probe_summary.example.json",
              "scripts/launch_long_horizon.ps1",
              "scripts/launch_lh_watchdog.ps1",
              "living/aetheria_canon.py",
              "living/m6_sandbox_target.py",
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit(f"missing required files: {missing}")
          print("ok", len(required), "paths")
          PY

      - name: No absolute Windows operator paths in public docs
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = []
          for p in list(Path(".").rglob("*.md")) + list(Path(".").rglob("*.example.*")):
              if ".git" in p.parts:
                  continue
              text = p.read_text(encoding="utf-8", errors="replace")
              for needle in (r"C:\\Users\\", "C:/Users/", r"C:\\Users"):
                  if needle in text or "C:\\Users" in text:
                      bad.append(str(p))
                      break
          if bad:
              raise SystemExit(f"operator absolute paths found in: {bad}")
          print("path sanitize ok")
          PY

      - name: Portable process-identity tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_lh_process_identity.py tests/test_arbitrary_path.py tests/test_failure_recovery.py tests/test_research_substrate.py tests/test_elastic.py -q --tb=short

  windows-control-plane:
    name: Windows launcher and process tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q scripts living tests research
      - name: Portable + Windows identity tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_lh_process_identity.py tests/test_lh_process_windows.py tests/test_arbitrary_path.py tests/test_failure_recovery.py tests/test_research_substrate.py tests/test_elastic.py -q --tb=short
      - name: PowerShell launcher parse
        shell: pwsh
        run: |
          Get-Command powershell | Out-Null
          if (-not (Test-Path scripts/launch_long_horizon.ps1)) { throw "missing launcher" }
          if (-not (Test-Path scripts/launch_lh_watchdog.ps1)) { throw "missing watchdog launcher" }
          Write-Output "launchers present"
